<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Helvetica, Arial, sans-serif" font-size="18">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <style>
    .t { fill: #1f2937; text-anchor: middle; }
    .b { font-weight: bold; font-size: 21px; }
    .s { font-size: 14px; fill: #4b5563; }
    .c { font-family: Menlo, Consolas, monospace; font-size: 15px; fill: #0f766e; }
    .l { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#a); }
  </style>

  <!-- Dockerfile -->
  <path d="M40 60 h130 l30 30 v110 h-160 z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="120" y="115" class="t b">Dockerfile</text>
  <text x="120" y="142" class="t s">the recipe</text>
  <text x="120" y="165" class="t s">(text file)</text>

  <!-- Image -->
  <g>
    <rect x="370" y="80"  width="190" height="30" rx="4" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="370" y="112" width="190" height="30" rx="4" fill="#93c5fd" stroke="#2563eb"/>
    <rect x="370" y="144" width="190" height="30" rx="4" fill="#60a5fa" stroke="#2563eb"/>
    <rect x="370" y="176" width="190" height="30" rx="4" fill="#3b82f6" stroke="#2563eb"/>
  </g>
  <text x="465" y="60" class="t b">Image</text>
  <text x="465" y="232" class="t s">read-only template, made of layers</text>

  <!-- Containers -->
  <g>
    <rect x="760" y="50"  width="170" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="845" y="86" class="t">container 1</text>
    <rect x="760" y="125" width="170" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="845" y="161" class="t">container 2</text>
  </g>
  <text x="845" y="215" class="t s">running instances,</text>
  <text x="845" y="233" class="t s">each with its own writable layer</text>

  <!-- arrows -->
  <path class="l" d="M205 140 H360"/>
  <text x="282" y="128" class="t c">docker build</text>
  <path class="l" d="M570 130 C650 130 680 80 752 80"/>
  <path class="l" d="M570 150 C650 150 680 155 752 155"/>
  <text x="665" y="190" class="t c">docker run</text>

  <!-- Registry -->
  <rect x="330" y="295" width="270" height="50" rx="25" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="465" y="326" class="t">Registry (Docker Hub, ghcr.io)</text>
  <path class="l" d="M430 244 V287"/>
  <path class="l" d="M500 287 V244"/>
  <text x="395" y="272" class="t c">push</text>
  <text x="535" y="272" class="t c">pull</text>
</svg>
